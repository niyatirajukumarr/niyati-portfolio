name: verify

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static lint
        run: bash scripts/lint.sh

      - name: Secret scan (full history)
        run: |
          set -uo pipefail
          PATTERNS='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nEI "$PATTERNS" -- . ':!*.jpg' ':!*.png' ':!*.woff2' ':!scripts/scan-secrets.sh' ':!.github/workflows/ci.yml' ':!RULES.md'; then
            echo "::error::possible secret committed"; exit 1
          fi
          echo "secret scan clean"

      - name: Fail on tracked .env
        run: |
          if git ls-files | grep -qE '(^|/)\.env'; then
            echo "::error::.env is tracked"; exit 1
          fi
          echo "no tracked .env"
